
name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pygame pyinstaller

      - name: Build EXE
        run: |
          python -m PyInstaller `
            --onedir `
            --windowed `
            --name ExcellentSpaceShooter `
            --collect-all pygame `
            --add-data "assets;assets" `
            main.py

      - name: Upload EXE
        uses: actions/upload-artifact@v7
        with:
          name: ExcellentSpaceShooter-Windows
          path: dist/ExcellentSpaceShooter/
